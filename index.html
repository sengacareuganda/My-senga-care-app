<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Senga Care - REAL</title>
<style>body{font-family:Arial;background:#fff0f5;margin:0;padding:10px}.header{background:#e91e63;color:#fff;padding:15px;text-align:center;border-radius:10px}video{width:100%;border-radius:10px}.card{background:#fff;padding:10px;margin:10px 0;border-radius:10px}button{background:#e91e63;color:#fff;border:none;padding:12px;width:100%;border-radius:20px;font-weight:bold}</style>
</head>
<body>
<div class="header"><h2>💖 SENGA CARE - REAL BUSINESS</h2><p>Points: <span id="pts">0</span></p></div>

<div class="card" style="border:2px solid gold">
<h3>👑 CEO UPLOAD - REAL CLOUD</h3>
<input type="file" id="f" accept="video/*"><br><br>
<input id="t" placeholder="Title" style="width:100%;padding:10px">
<button onclick="realUpload()">UPLOAD TO CLOUD - ALL GIRLS WILL SEE</button>
<p id="status"></p>
</div>

<div id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-storage.js";
import { getFirestore, collection, addDoc, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

// PASTE YOUR FIREBASE CONFIG HERE (I will give you)
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "senga-care.firebaseapp.com",
  projectId: "senga-care",
  storageBucket: "senga-care.appspot.com",
};

const app = initializeApp(firebaseConfig);
const storage = getStorage(app);
const db = getFirestore(app);

window.realUpload = async () => {
  const file = document.getElementById('f').files[0];
  const title = document.getElementById('t').value;
  if(!file) return alert('Select video from gallery');
  document.getElementById('status').innerText = 'Uploading to cloud... Please wait';
  
  const storageRef = ref(storage, 'videos/' + Date.now() + file.name);
  await uploadBytesResumable(storageRef, file);
  const url = await getDownloadURL(storageRef);
  
  await addDoc(collection(db, 'videos'), { title, url, createdAt: Date.now() });
  document.getElementById('status').innerText = '✅ REAL UPLOAD DONE! All girls can see now.';
  loadVideos();
}

async function loadVideos(){
  const q = query(collection(db, 'videos'), orderBy('createdAt','desc'));
  const snap = await getDocs(q);
  const list = document.getElementById('list');
  list.innerHTML='';
  snap.forEach(doc=>{
    const v=doc.data();
    list.innerHTML+=`<div class=card><h4>${v.title}</h4><video controls src="${v.url}" onended="earn()"></video><button onclick="earn()">Watch = Earn 1 Pad</button></div>`;
  });
}
window.earn=()=>{ let p=parseInt(localStorage.getItem('pts')||0)+1; localStorage.setItem('pts',p); document.getElementById('pts').innerText=p; alert('You earned 1 Pad! Total: '+p); }
loadVideos();
</script>
</body>
</html>
